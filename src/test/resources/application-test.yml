spring:
  datasource:
    url: jdbc:h2:mem:cashi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
logging:
  level:
    com.cashi.fees: INFO
    liquibase: WARN
    org.testcontainers: WARN