databaseChangeLog:
  - changeSet:
      id: 001-create-fee-records
      author: Osaid Alhomedy
      changes:
        - createTable:
            tableName: fee_records
            columns:
              - column:
                  name: transaction_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: transaction_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(20,4)
                  constraints:
                    nullable: false
              - column:
                  name: asset
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: fee
                  type: NUMERIC(20,4)
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: NUMERIC(12,6)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: charge_id
                  type: VARCHAR(64)
              - column:
                  name: state
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-add-charged-at
      author: Osaid Alhomedy
      changes:
        - addColumn:
            tableName: fee_records
            columns:
              - column:
                  name: charged_at
                  type: TIMESTAMP WITH TIME ZONE